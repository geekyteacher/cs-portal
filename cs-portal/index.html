<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Portal</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    h1, h2 { color: var(--accent); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 1rem;
      margin-bottom: 2.5rem;
    }
    .card {
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      color: var(--text);
      font-weight: bold;
      border: 1px solid #334155;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    .card span {
      display: block;
      font-size: 0.8rem;
      font-weight: normal;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>

  <h1>Computer Science Portal</h1>

  <h2>Classroom Portals</h2>
  <div class="grid">
    <a href="https://y5.geeky-teacher.com" class="card">Year 5 <span>Grade 4</span></a>
    <a href="https://y6.geeky-teacher.com" class="card">Year 6 <span>Grade 5</span></a>
    <a href="https://y7.geeky-teacher.com" class="card">Year 7 <span>Grade 6</span></a>
    <a href="https://y8.geeky-teacher.com" class="card">Year 8 <span>Grade 7</span></a>
    <a href="https://y9.geeky-teacher.com" class="card">Year 9 <span>Grade 8</span></a>
    <a href="https://y10.geeky-teacher.com" class="card">Year 10 <span>Grade 9</span></a>
    <a href="https://y11.geeky-teacher.com" class="card">Year 11 <span>Grade 10</span></a>
  </div>

  <h2>No-Sign-Up Tools</h2>
  <div class="grid">
    <a href="https://scratch.mit.edu/projects/editor/" target="_blank" rel="noopener" class="card">Scratch</a>
    <a href="https://edublocks.org/" target="_blank" rel="noopener" class="card">EduBlocks</a>
    <a href="https://futurecoder.io/" target="_blank" rel="noopener" class="card">FutureCoder</a>
    <!-- <a href="https://trinket.io/python" target="_blank" rel="noopener" class="card">Trinket Python</a> -->
    <a href="https://makecode.microbit.org/" target="_blank" rel="noopener" class="card">micro:bit</a>
  </div>

</body>
</html>
