<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geeky Teacher</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #38bdf8;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 1.75rem;
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--accent);
        }

        p {
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.6;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Geeky Teacher</h1>
        <p>Looking for the class pages?<br>Ask your teacher, Mr F!</p>
    </div>

</body>
</html>
